<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="kf.js"></script>
    <style>
      @font-face { font-family: "Bebas Neue"; src: url("assets/fonts/BebasNeue-Regular.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Barlow"; src: url("assets/fonts/Barlow-SemiBold.ttf") format("truetype"); font-weight: 600; }
      @font-face { font-family: "Barlow"; src: url("assets/fonts/Barlow-Bold.ttf") format("truetype"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: #1B1F24; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1B1F24; font-family: "Barlow", sans-serif; }
      .vid { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; background: #1B1F24; }
      .vid.half { width: 960px; object-fit: cover; object-position: 50% 50%; }
      .vid.half.right { left: 960px; }
    </style>
  </head>
  <body>
    <!--
      Clay Rush presentation video, 32.6 s, 1920x1080, 30 fps. No voice-over: burned-in title cards, music and sound effects.
      Every gameplay picture is the REAL game captured frame by frame (video/tools/capture-gameplay.mjs, played by the built-in bot).
      Runtime: Web Animations API through kf.js (no GSAP, nothing fetched at render time).
      Scenes: intro 0-3.55 | "Call Pull!" 3.55-6.28 | stage montage 6.28-19.1 | Easy vs Hard 19.1-22.37 | Time Attack 22.37-25.1
              | results 25.1-28.38 | end card 28.38-32.6
    -->
    <div id="root" data-no-timeline data-composition-id="main" data-start="0" data-duration="32.6" data-width="1920" data-height="1080">

      <div id="h-intro" class="clip" data-no-timeline data-composition-id="intro" data-composition-src="compositions/intro.html"
           data-start="0" data-duration="3.6" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- FOOTAGE:BEGIN (generated by video/tools/build-edit.mjs from edit.json) -->
      <video id="v-pull" class="vid" src="footage/classic.mp4" data-start="3.55" data-duration="2.73" data-media-start="0.3" data-track-index="2" muted playsinline></video>
      <video id="v-meadow" class="vid" src="footage/classic.mp4" data-start="6.28" data-duration="1.94" data-media-start="4.55" data-track-index="2" muted playsinline></video>
      <video id="v-hillsin" class="vid" src="footage/classic.mp4" data-start="8.22" data-duration="3.25" data-media-start="18.1" data-track-index="2" muted playsinline></video>
      <video id="v-double" class="vid" src="footage/classic.mp4" data-start="11.47" data-duration="2.73" data-media-start="24.55" data-track-index="2" muted playsinline></video>
      <video id="v-alpinein" class="vid" src="footage/classic.mp4" data-start="14.2" data-duration="2.18" data-media-start="41.5" data-track-index="2" muted playsinline></video>
      <video id="v-rabbit" class="vid" src="footage/classic.mp4" data-start="16.38" data-duration="2.72" data-media-start="46.4" data-track-index="2" muted playsinline></video>
      <video id="v-easy" class="vid half left" src="footage/easy.mp4" data-start="19.1" data-duration="3.27" data-media-start="0.4" data-track-index="2" muted playsinline></video>
      <video id="v-hard" class="vid half right" src="footage/hard.mp4" data-start="19.1" data-duration="3.27" data-media-start="0.4" data-track-index="3" muted playsinline></video>
      <video id="v-ta" class="vid" src="footage/timeattack.mp4" data-start="22.37" data-duration="2.73" data-media-start="0.25" data-track-index="2" muted playsinline></video>
      <video id="v-results" class="vid" src="footage/classic.mp4" data-start="25.1" data-duration="3.28" data-media-start="65.3" data-track-index="2" muted playsinline></video>
      <!-- FOOTAGE:END -->

      <div id="h-titles" class="clip" data-no-timeline data-composition-id="titles" data-composition-src="compositions/titles.html"
           data-start="3.55" data-duration="24.83" data-track-index="5" data-width="1920" data-height="1080"></div>

      <div id="h-end" class="clip" data-no-timeline data-composition-id="endcard" data-composition-src="compositions/endcard.html"
           data-start="28.38" data-duration="4.22" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="h-wipes" class="clip" data-no-timeline data-composition-id="wipes" data-composition-src="compositions/wipes.html"
           data-start="0" data-duration="32.6" data-track-index="9" data-width="1920" data-height="1080"></div>

      <audio id="mix" src="audio/mix.wav" data-start="0" data-duration="32.6" data-track-index="11" data-volume="1"></audio>
    </div>
    <script>
      // slow push-in on every gameplay slot (the footage itself is not retimed or altered)
      (function () {
        /* PUSHIN:BEGIN */ var PUSH = [["#v-pull", 3.55, 2.73], ["#v-meadow", 6.28, 1.94], ["#v-hillsin", 8.22, 3.25], ["#v-double", 11.47, 2.73], ["#v-alpinein", 14.2, 2.18], ["#v-rabbit", 16.38, 2.72], ["#v-easy", 19.1, 3.27], ["#v-hard", 19.1, 3.27], ["#v-ta", 22.37, 2.73], ["#v-results", 25.1, 3.28]]; /* PUSHIN:END */
        PUSH.forEach(function (c) {
          KF.track(0, c[0], [{ t: c[1], s: 1.0 }, { t: c[1] + c[2], s: 1.025 }], { ease: KF.E.lin });
        });
      })();
    </script>
  </body>
</html>
